[package]
name = "mobile-api-studio-server"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
app-core = { path = "../../crates/app-core" }
axum = "0.8.9"
core-model = { path = "../../crates/core-model" }
getrandom = "0.4"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }
