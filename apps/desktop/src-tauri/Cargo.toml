[package]
name = "mobile-api-studio"
version = "0.0.1"
description = "Mobile API Studio desktop application"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "mobile_api_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ai-core = { path = "../../../crates/ai-core" }
ai-storage = { path = "../../../crates/ai-storage" }
base64.workspace = true
capture-core = { path = "../../../crates/capture-core" }
capture-mitm = { path = "../../../crates/capture-mitm" }
compare-core = { path = "../../../crates/compare-core" }
core-model = { path = "../../../crates/core-model" }
device-android = { path = "../../../crates/device-android" }
device-ios = { path = "../../../crates/device-ios" }
mock-core = { path = "../../../crates/mock-core" }
mock-fixtures = { path = "../../../crates/mock-fixtures" }
mock-storage = { path = "../../../crates/mock-storage" }
replay = { path = "../../../crates/replay" }
sdk-protocol = { path = "../../../crates/sdk-protocol" }
sdk-storage = { path = "../../../crates/sdk-storage" }
sdk-transport = { path = "../../../crates/sdk-transport" }
secret-store = { path = "../../../crates/secret-store" }
serde.workspace = true
serde_json.workspace = true
storage = { path = "../../../crates/storage" }
tauri = { version = "2", features = [] }
tokio.workspace = true
workspace-core = { path = "../../../crates/workspace-core" }
