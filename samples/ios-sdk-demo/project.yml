name: MobileAPIStudioSample
options:
  bundleIdPrefix: dev.mobileapistudio
packages:
  MobileAPIStudio:
    path: ../../sdks/ios/MobileAPIStudio
targets:
  MobileAPIStudioSample:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    dependencies:
      - package: MobileAPIStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobileapistudio.sample.ios
        PRODUCT_NAME: Mobile API Studio Sample
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
