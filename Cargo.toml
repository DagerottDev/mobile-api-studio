[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/local-server",
  "crates/app-core",
  "crates/core-model",
  "crates/capture-core",
  "crates/capture-mitm",
  "crates/storage",
  "crates/device-ios",
  "crates/device-android",
  "crates/replay",
  "crates/workspace-core",
  "crates/secret-store",
  "crates/mock-core",
  "crates/mock-storage",
  "crates/mock-fixtures",
  "crates/sdk-protocol",
  "crates/sdk-storage",
  "crates/sdk-transport",
  "crates/compare-core",
  "crates/ai-core",
  "crates/ai-storage",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "sync", "time"] }
