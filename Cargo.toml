[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/core-model",
  "crates/capture-core",
  "crates/storage",
  "crates/device-ios",
  "crates/device-android",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }
